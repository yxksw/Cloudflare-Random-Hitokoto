name: Update and Deploy

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  schedule:
    - cron: "0 0 */3 * *" # 每 3 天运行一次（UTC 0:00）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest sentences
        run: git clone --depth 1 https://github.com/hitokoto-osc/sentences-bundle.git

      - name: Generate static API data
        run: python gen_advanced.py

      - name: Validate generated site
        shell: bash
        run: |
          test -s rules.txt
          test -d orig_data
          test -d categories
          test "$(find orig_data -type f -name '*.json' | wc -l)" -ge 65536
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [Path("orig_data/0000.json"), *sorted(Path("categories").glob("*/000.json"))]:
              with path.open(encoding="utf-8") as file:
                  json.load(file)
          PY

      - name: Remove source data
        run: rm -rf sentences-bundle

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4